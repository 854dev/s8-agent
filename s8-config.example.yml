# S8 장비별 설정. 비밀이 아닌 값만 둔다(서비스 키·봇 토큰은 .env).
# cp s8-config.example.yml s8-config.yml 후 이 장비에 맞게 고친다. s8-config.yml은 git에 올리지 않는다.
# 생략한 항목은 아래 주석의 기본값을 쓴다. 모르는 키가 있으면 시작하지 않는다.
# 확인: node pi/bin/s8-config.mjs show

# KB 저장소 경로. 매니저·스케줄러의 작업 위치이고 KB Browser가 읽는 문서 경로다.
# 상대 경로는 이 저장소 기준, ~/는 홈 디렉터리. 기본값: ../854_md
kbRoot: /home/user/kb_root

projectman:
  # PH-CMS Projectman API 주소. HTTPS 또는 루프백 HTTP. 없으면 Projectman 도구를 쓸 수 없다. 기본값: 없음
  apiUrl: http://127.0.0.1:8000/api/v2
  # start-infra.sh가 phcms 창에서 실행할 명령. 기본값: 없음(창을 비워 둔다)
  startCommand: null
  # startCommand: cd /home/user/ph-cms && pnpm build && pnpm dev

network:
  # 라우터 공개 바인딩 IP. 기본은 localhost 전용, 원격 접속 시 실제 Tailscale IPv4로 바꾼다.
  # 웹 터미널에는 별도 인증이 없으므로 0.0.0.0은 받지 않는다. 기본값: 127.0.0.1
  bindIp: 127.0.0.1
  # 라우터 공개 포트. frontend 개발 서버의 API 프록시도 이 IP·포트를 쓴다. 기본값: 80
  # 리눅스에서 1024 미만 포트는 한 번 허용해야 한다(README의 "80번 포트 허용" 참고). macOS는 필요 없다.
  httpPort: 80

# 상주 워커. ./s8.sh로 런타임을 시작하면 항목마다 s8-workers:worker-<id> 창에 워커 루프가 뜬다. 기본값: 없음
#   id    워커 이름. 소문자로 시작하고 소문자·숫자·-만 쓴다(32자 이하). 작업 spec.assignee에 이 이름을 쓸 수 있다
#   mode  기본 모드. 기본값: passive
#         active   실행 대기(ready) 작업을 스스로 맡는다
#         passive  콘솔이나 매니저의 지시를 받아야 맡는다
#         paused   새 작업을 맡지 않는다
# 실행 중 모드는 S8 콘솔(작업과 결정 화면)이나 매니저에게 요청해 바꾼다. 바꾼 모드는 재시작해도 유지되고, 콘솔에서 설정값으로 되돌린다.
workers: []
# workers:
#   - id: dev-1
#     mode: active
#   - id: dev-2
#     mode: passive

telegram:
  # 봇에 말을 걸 수 있는 사용자 ID(양수)와 그룹 ID(음수). 따옴표로 감싼다. 기본값: 없음(Telegram 사용 안 함)
  allowedUserIds:
    - "123456789"
  allowedGroupIds: []
  # 예약·작업 알림을 받을 chat ID. 위 허용 목록 중 하나여야 한다.
  # 개인 알림은 사용자 ID, 그룹 알림은 그룹 ID. 아직 정하지 않았으면 null(알림을 보내지 않는다).
  scheduleChatId: "123456789"

# Telegram 알림에 넣을 S8 화면 주소(작업 링크). 실제 접속 경로로 지정한다. 기본값: null(링크 없음)
publicUrl: null

# 매니저 중개 통신(WebSocket). 사용 전 README의 인증 파일과 역할별 실행 안내를 확인한다.
# 생략 또는 enabled: false면 기존 로컬 실행을 유지한다.
# 활성화하면 nodeId, credentialsFile, managerUrl이 필수다.
# 비밀값은 YAML에 넣지 않는다. credentialsFile은 별도 인증 파일의 경로이며 설정 검증 시 내용을 읽지 않는다.
# 인증 파일의 workers 객체에 워커 ID별 토큰을 등록한다. 매니저에는 모든 워커, 원격 워커에는 자신의 항목만 둔다.
# 같은 워커의 토큰은 양쪽이 일치해야 한다. 파일 권한은 600으로 두고 Git에 올리지 않는다.
# 인증 파일을 변경하면 통신 서버와 해당 워커 루프를 재시작한다.
# 매니저와 로컬 워커를 함께 실행하는 예시:
# communication:
#   # 통신 기능 활성화. 기본값: false
#   enabled: true
#   # 이 장비의 식별자. workers[].id와 별개이며 소문자로 시작하는 소문자·숫자·-(32자 이하)를 쓴다.
#   nodeId: manager-host
#   # 인증 파일 경로. 상대 경로는 이 저장소 기준이며 ~/도 사용할 수 있다.
#   credentialsFile: /home/user/.config/s8/communication-secrets.json
#   # 연결을 받는 매니저 장비에만 지정한다. 워커 전용 장비에서는 생략한다.
#   server:
#     # 기본값: 127.0.0.1(현재 장비에서만 접속). 원격 워커를 받을 때는 실제 사설망 IP를 쓴다.
#     # 0.0.0.0과 ::는 허용하지 않는다. 웹 UI의 network.bindIp와는 별개다.
#     bindIp: 127.0.0.1
#     # 통신 서버 포트. 기본값: 8090. 웹 UI의 network.httpPort와는 별개다.
#     port: 8090
#   # 워커가 접속할 매니저 주소. 이 장비의 로컬 워커도 이 주소를 사용한다.
#   # ws://호스트:포트 또는 wss://호스트 형식. 경로·쿼리·프래그먼트·인증정보를 붙이지 않는다.
#   managerUrl: ws://127.0.0.1:8090
# 장비 간 연결에는 Tailscale 등 암호화된 사설망이나 TLS 프록시의 WSS를 사용한다. 내장 서버는 WS를 제공한다.
# 원격 워커도 받으면 server.bindIp와 로컬 워커의 managerUrl을 매니저의 실제 사설망 IP로 맞춘다.
# 원격 워커 전용 장비는 server를 생략하고 managerUrl을 매니저의 사설망 주소로 지정한다.
# 워커는 매니저로 연결하므로 워커 장비에 수신 포트를 열 필요가 없다.
# workers 목록은 이 장비에서 실행할 워커만 적는다. 원격 워커를 매니저의 workers에 넣지 않는다.
# 워커 ID는 전체 장비에서 중복되지 않아야 하며 manager는 예약 이름이다.
# 다른 장비에서 경로가 다를 때만 repoPath별 로컬 매핑을 등록한다. 생략하면 repoPath에서 직접 실행한다.
# 이 매핑은 실행 경로만 바꾼다. 저장소 복제·Git 동기화·파일 전달을 자동으로 수행하지 않는다.
# communication 블록 안에 추가:
#   repositories:
#     # 키: Projectman 작업의 spec.repoPath에 기록된 절대 경로
#     /manager/projects/app:
#       # 값: 이 장비에서 실제로 작업할 경로. 상대 경로는 이 저장소 기준이며 ~/도 사용할 수 있다.
#       path: /srv/projects/app
#       # remote는 실행에 필요하지 않다. Git 사용은 에이전트가 판단한다.
#     /manager/reports:
#       path: /srv/s8-reports
#       kind: files              # 선택적 메타데이터. UID 하위 폴더 없이 path에서 실행한다.
