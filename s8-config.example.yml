# 비인증 설정만 저장한다. 봇 토큰·서비스 키는 환경변수에 유지한다.
telegram:
  allowedUserIds:
    - "123456789"
  allowedGroupIds: []
  # 개인 알림은 해당 사용자의 chat ID, 그룹 알림은 허용된 그룹 chat ID를 지정한다.
  # 아직 대상을 지정하지 않을 때는 null로 두며 임의 수신자를 자동 선택하지 않는다.
  scheduleChatId: "123456789"

# key가 고유 workerId다. 로컬 Pi 예시 두 개이며 원격/external은 문서의 워커 설정 안내를 따른다.
worker-entries:
  worker-1:
    agent: pi
    host: local
    launch: managed
  worker-2:
    agent: pi
    host: local
    launch: managed
# Loopback은 로컬 워커 전용. 원격 워커는 bindAddress와 url을 장치의 Tailscale IPv4로 맞춘다.
worker-communicator:
  bindAddress: 127.0.0.1
  port: 38771
  url: http://127.0.0.1:38771
# Telegram 알림에서 열 s8 화면의 공개 URL. 실제 배포 경로로 지정한다.
publicUrl: null
