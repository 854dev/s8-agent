# S8 장비별 설정. 비밀이 아닌 값만 둔다(서비스 키·봇 토큰은 .env).
# cp config.example.yml config.yml 후 이 장비에 맞게 고친다. config.yml은 git에 올리지 않는다.
# 생략한 항목은 아래 주석의 기본값을 쓴다. 모르는 키가 있으면 시작하지 않는다.
# 확인: node pi/bin/s8-config.mjs show

# KB 저장소 경로. 매니저·스케줄러의 작업 위치이고 KB Browser가 읽는 문서 경로다.
# 상대 경로는 이 저장소 기준, ~/는 홈 디렉터리. 기본값: ../854_md
kbRoot: /home/user/kb_root

projectman:
  # PH-CMS Projectman API 주소. HTTPS 또는 루프백 HTTP. 없으면 Projectman 도구를 쓸 수 없다. 기본값: 없음
  apiUrl: http://127.0.0.1:8000/api/v2
  # start-infra.sh가 phcms 창에서 실행할 명령. 기본값: 없음(창을 비워 둔다)
  startCommand: null
  # startCommand: cd /home/user/ph-cms && pnpm build && pnpm dev

network:
  # 라우터 공개 바인딩 IP. 기본은 localhost 전용, 원격 접속 시 실제 Tailscale IPv4로 바꾼다.
  # 웹 터미널에는 별도 인증이 없으므로 0.0.0.0은 받지 않는다. 기본값: 127.0.0.1
  bindIp: 127.0.0.1
  # 라우터 공개 포트. frontend 개발 서버의 API 프록시도 이 IP·포트를 쓴다. 기본값: 80
  # 리눅스에서 1024 미만 포트는 한 번 허용해야 한다(README의 "80번 포트 허용" 참고). macOS는 필요 없다.
  httpPort: 80

# 상주 워커. ./s8.sh로 런타임을 시작하면 항목마다 s8-workers:worker-<id> 창에 워커 루프가 뜬다. 기본값: 없음
#   id    워커 이름. 소문자로 시작하고 소문자·숫자·-만 쓴다(32자 이하). 작업 spec.assignee에 이 이름을 쓸 수 있다
#   mode  기본 모드. 기본값: passive
#         active   실행 대기(ready) 작업을 스스로 맡는다
#         passive  콘솔이나 매니저의 지시를 받아야 맡는다
#         paused   새 작업을 맡지 않는다
# 실행 중 모드는 S8 콘솔(작업과 결정 화면)이나 매니저에게 요청해 바꾼다. 바꾼 모드는 재시작해도 유지되고, 콘솔에서 설정값으로 되돌린다.
workers: []
# workers:
#   - id: dev-1
#     mode: active
#   - id: dev-2
#     mode: passive

telegram:
  # 봇에 말을 걸 수 있는 사용자 ID(양수)와 그룹 ID(음수). 따옴표로 감싼다. 기본값: 없음(Telegram 사용 안 함)
  allowedUserIds:
    - "123456789"
  allowedGroupIds: []
  # 예약·작업 알림을 받을 chat ID. 위 허용 목록 중 하나여야 한다.
  # 개인 알림은 사용자 ID, 그룹 알림은 그룹 ID. 아직 정하지 않았으면 null(알림을 보내지 않는다).
  scheduleChatId: "123456789"

# Telegram 알림에 넣을 S8 화면 주소(작업 링크). 실제 접속 경로로 지정한다. 기본값: null(링크 없음)
publicUrl: null

# 에이전트 메시지 통신. 실행 중인 세션 사이에서 apps/comm-center를 거쳐 텍스트만 전달한다.
# 원격 작업 실행·모드 변경·파일 전송·에이전트 자동 생성은 하지 않는다. 매니저·워커 모두 같은 형식이다.
# 정체성과 역할은 comm-center 등록부가 토큰으로 정한다. 토큰은 YAML에 넣지 않고 권한 600의 토큰 파일에 둔다.
# 토큰 발급: npm run issue --prefix apps/comm-center -- <등록부> <id> <manager|worker> <토큰파일> (apps/comm-center/README.md)
# 연결에는 암호화된 사설망 또는 WSS를 사용한다. 에이전트 장비에 수신 포트는 필요 없다.
# 같은 토큰은 한 번에 한 세션만 연결한다. 여러 세션은 각각 토큰을 발급하고 S8_COMM_TOKEN_FILE=경로 로 지정한다.
# 기본값: enabled false
# communication:
#   enabled: true
#   url: ws://10.0.0.10:8090
#   tokenFile: /home/user/.config/s8/comm-a.json
