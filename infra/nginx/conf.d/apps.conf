# Add application upstreams and routes here.
# Keep each app bound to localhost; expose only this router on Tailscale.

upstream s8_app {
    server host.docker.internal:4178;
}

upstream kb_browser {
    server kb-browser:8787;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 200M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","router":"854md-nginx"}';
    }

    location = / {
        default_type text/plain;
        return 200 "854_md router is running\n";
    }

    location = /homepage {
        return 301 /homepage/;
    }

    location /homepage/ {
        alias /usr/share/nginx/html/homepage/;
        index index.html;
    }

    location = /api/docs/health {
        proxy_pass http://kb_browser/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/docs/ {
        proxy_pass http://kb_browser/api/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/files/upload {
        client_max_body_size 200M;
        proxy_pass http://kb_browser/api/files/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /s8/ {
        proxy_pass http://s8_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /s8;
    }

    # Example for another local app:
    # upstream other_app { server host.docker.internal:3000; }
    # location /other/ { proxy_pass http://other_app/; }
}