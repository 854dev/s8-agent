# 중앙 장치: 로컬 Pi 워커 2개 + SSH로 관리하는 원격 Claude 워커 1개.
# 이 파일을 중앙 장치의 s8-config.yml로 복사한다.
# 예시 IP: 중앙 100.100.0.10, 원격 100.100.0.20. 실제 Tailscale IPv4로 바꾼다.
# 기존 Telegram 알림을 유지하려면 telegram과 publicUrl을 기존 설정에서 옮긴다.
telegram:
  allowedUserIds: []
  allowedGroupIds: []
  scheduleChatId: null

worker-entries:
  worker-1:
    agent: pi
    host: local
    launch: managed
  worker-2:
    agent: pi
    host: local
    launch: managed
  remote-claude-1:
    agent: claude-code
    # worker를 실제 원격 SSH 사용자명으로 바꾼다.
    host: ssh://worker@100.100.0.20
    launch: managed
    # 원격 장치에 있는 s8-agent checkout의 절대 경로.
    root: /home/worker/s8-agent

worker-communicator:
  # 중앙 장치 자신의 Tailscale IPv4. url의 IP와 같아야 한다.
  bindAddress: 100.100.0.10
  port: 38771
  url: http://100.100.0.10:38771

# 저장소 경로 매핑은 원격 장치의 설정에 지정한다.
repository-mappings: {}
publicUrl: null

# 원격 장치의 s8-config.yml에는 s8-config.remote-daemon.example.yml을 사용한다.
# 중앙에서 remote-claude-1의 worker-token을 발급해 원격에 안전하게 전달한다.
# 원격에는 Claude CLI 인증과 PHCMS_MCP_URL/PHCMS_ACCESS_TOKEN 설정이 필요하다.
