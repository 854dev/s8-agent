# 원격 장치용 보조 설정. 중앙의 remote-claude-1과 연결한다.
# 원격 s8-agent checkout의 s8-config.yml로 복사한다.
telegram:
  allowedUserIds: []
  allowedGroupIds: []
  scheduleChatId: null

worker-entries:
  remote-claude-1:
    agent: claude-code
    # 원격 장치는 자신을 기동하지 않는다. 중앙의 managed SSH가 daemon을 기동한다.
    launch: external

worker-communicator:
  # 두 값 모두 중앙 장치의 Tailscale IPv4를 사용한다.
  # 원격에서는 worker 서비스만 실행하므로 이 주소로 서버를 띄우지 않는다.
  bindAddress: 100.100.0.10
  port: 38771
  url: http://100.100.0.10:38771

# 왼쪽: Projectman 계획의 repoPath(중앙 장치 경로).
# 오른쪽: 같은 Git 저장소를 원격 장치에 clone한 절대 경로.
# 실제 작업 저장소마다 항목을 추가한다. 승인된 baseCommit이 원격에도 있어야 한다.
repository-mappings:
  /srv/projects/my-project: /home/worker/projects/my-project

publicUrl: null

# 중앙과 동일한 토큰을 이 checkout의 .s8-runtime/worker-auth/remote-claude-1.token에
# 권한 600으로 배치한다. 토큰 값은 YAML이나 명령 인자에 넣지 않는다.
# 수동 확인: bash start-pi.sh --service worker remote-claude-1
# 중앙이 이미 같은 daemon을 기동했다면 중복 실행하지 않는다.
