# 중앙 장치: 로컬 Pi 워커 2개.
# 이 파일을 중앙 장치의 s8-config.yml로 복사한다.
# 기존 Telegram 알림을 유지하려면 telegram과 publicUrl을 기존 설정에서 옮긴다.
telegram:
  allowedUserIds: []
  allowedGroupIds: []
  scheduleChatId: null

worker-entries:
  worker-1:
    agent: pi
    host: local
    launch: managed
  worker-2:
    agent: pi
    host: local
    launch: managed

worker-communicator:
  bindAddress: 127.0.0.1
  port: 38771
  url: http://127.0.0.1:38771

repository-mappings: {}
publicUrl: null
